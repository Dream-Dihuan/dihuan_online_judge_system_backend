spring:
  config:
    import: optional:file:.env.local[.properties],optional:file:../.env.local[.properties]
  application:
    name: dihuan-ai-service
  chat-memory:
    datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: ${CHAT_MEMORY_DATABASE_URL:jdbc:mysql://127.0.0.1:3306/dihuan_online_judge_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      username: ${CHAT_MEMORY_DATABASE_USERNAME:root}
      password: ${CHAT_MEMORY_DATABASE_PASSWORD:root}
  ai:
    openai:
      # LLM 聊天模型配置。这里可以使用与 Embedding 不同的服务商。
      base-url: ${AI_API_BASE_URL:https://api.openai.com}
      api-key: ${AI_API_KEY}
      chat:
        options:
          model: ${AI_CHAT_MODEL:deepseek-chat}
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5-coder:1.5b
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: ${RAG_EMBEDDING_DIMENSION:1024}
        index-type: HNSW
        distance-type: COSINE_DISTANCE
  cloud:
    sentinel:
      filter:
        enabled: true
      transport:
        dashboard: 127.0.0.1:8858
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
rag:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${RAG_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/dihuan_online_judge_system}
    username: ${RAG_DATABASE_USERNAME:postgres}
    password: ${RAG_DATABASE_PASSWORD:postgres}
  embedding:
    # RAG 使用的 Embedding 模型配置，当前通过 DashScope 原生 SDK 调用。
    provider: dashscope
    model: ${RAG_EMBEDDING_MODEL:qwen3.7-text-embedding-flash}
    dimension: ${RAG_EMBEDDING_DIMENSION:1024}
  search:
    keyword-weight: ${RAG_KEYWORD_WEIGHT:0.3}
    semantic-weight: ${RAG_SEMANTIC_WEIGHT:0.7}
server:
  port: 8084
  servlet:
    context-path: /api/ai
#springdoc:
#  default-flat-param-object: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
knife4j:
  enable: true