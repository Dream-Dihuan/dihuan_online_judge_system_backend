spring:
  application:
    name: dihuan-ai-service
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5-coder:1.5b
  cloud:
    sentinel:
      filter:
        enabled: true
      transport:
        dashboard: localhost:8090
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
server:
  port: 8084
  servlet:
    context-path: /api/ai
#springdoc:
#  default-flat-param-object: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
knife4j:
  enable: true
