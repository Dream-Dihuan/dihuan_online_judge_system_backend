spring:
  application:
    name: dihuan-ai-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${RAG_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/dihuan_online_judge_system}
    username: ${RAG_DATABASE_USERNAME:postgres}
    password: ${RAG_DATABASE_PASSWORD:postgres}
  ai:
    openai:
      # OpenAI-compatible remote API. The provider must support /embeddings.
      base-url: ${AI_API_BASE_URL:https://api.openai.com}
      api-key: ${AI_API_KEY}
      chat:
        options:
          model: ${AI_CHAT_MODEL:deepseek-chat}
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5-coder:1.5b
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: ${RAG_EMBEDDING_DIMENSION:1536}
        index-type: HNSW
        distance-type: COSINE_DISTANCE
  cloud:
    sentinel:
      filter:
        enabled: true
      transport:
        dashboard: 127.0.0.1:8858
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
rag:
  embedding:
    provider: dashscope
    model: ${RAG_EMBEDDING_MODEL:qwen3.7-text-embedding}
    dimension: ${RAG_EMBEDDING_DIMENSION:1536}
  search:
    keyword-weight: ${RAG_KEYWORD_WEIGHT:0.3}
    semantic-weight: ${RAG_SEMANTIC_WEIGHT:0.7}
server:
  port: 8084
  servlet:
    context-path: /api/ai
#springdoc:
#  default-flat-param-object: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
knife4j:
  enable: true