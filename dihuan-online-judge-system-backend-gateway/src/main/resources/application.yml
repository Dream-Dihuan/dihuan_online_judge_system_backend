spring:
  application:
    name: dihuan-gateway
  cloud:
    sentinel:
      filter:
        enabled: true
      transport:
        dashboard: 127.0.0.1:8858
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
    gateway:
      routes:
        - id: dihuan-user-service
          uri: lb://dihuan-user-service
          predicates:
            - Path=/api/user/**
        - id: dihuan-ai-service
          uri: lb://dihuan-ai-service
          predicates:
            - Path=/api/ai/**
        - id: dihuan-question-service
          uri: lb://dihuan-question-service
          predicates:
            - Path=/api/question/**
        - id: dihuan-judge-service
          uri: lb://dihuan-judge-service
          predicates:
            - Path=/api/judge/**
springdoc:
  default-flat-param-object: true
knife4j:
  gateway:
    # ① 第一个配置，开启gateway聚合组件
    enabled: true
    # ② 第二行配置，设置聚合模式采用discover服务发现的模式
    strategy: discover
    discover:
      # ③ 第三行配置，开启discover模式
      enabled: true
      # ④ 第四行配置
      version: openapi3
server:
  port: 8080